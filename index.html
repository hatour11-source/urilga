<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H&amp;A Travel: Шинэ жилийн баярын урилга</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800&family=Marck+Script&display=swap">
<style>
:root{--gold:#ffd166;--red:#ff4d6d;--ice:#8ee3ff;--ink:#0b1030;--cream:#fff7e6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--cream);font-family:"Nunito",system-ui,sans-serif;overflow-x:hidden;background:#070a24}
.sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#070a24,#141a5c 55%,#3b2a7a 100%)}
.aur{position:absolute;left:-20%;right:-20%;top:-10%;height:60%;filter:blur(40px);opacity:.55;background:linear-gradient(100deg,transparent 10%,#2cffb0 30%,#6a5cff 55%,#ff4dd2 75%,transparent 90%);animation:aur 12s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes aur{from{transform:skewX(-12deg) translateX(-6%)}to{transform:skewX(12deg) translateX(6%) scaleY(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.land{position:fixed;left:0;right:0;bottom:0;z-index:2;width:100%;height:34vh;min-height:200px;pointer-events:none}
.smoke{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smoke{from{opacity:.8;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-40px) scale(1.8)}}
.win{animation:glow 2.5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
main{position:relative;z-index:3;max-width:560px;margin:0 auto;padding:46px 18px 38vh;text-align:center}
.greet{font:400 clamp(1.8rem,8vw,2.6rem)/1.15 "Marck Script",cursive;margin:0;text-shadow:0 2px 12px #000a}
.year{font:400 clamp(3.8rem,21vw,7rem)/1.05 "Rubik Mono One",sans-serif;margin:6px 0 0;background:linear-gradient(100deg,#ff9f1c,#fff3b0 35%,#ffd166 50%,#fff3b0 65%,#ff9f1c) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #c9184a) drop-shadow(0 12px 22px #0008);animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.org{display:inline-block;margin-top:8px;padding:6px 16px;border:2px solid var(--gold);border-radius:999px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--gold);background:#ffffff10;backdrop-filter:blur(6px)}
.orb{display:block;margin:34px auto 0;width:150px;height:150px;border:0;border-radius:50%;cursor:pointer;color:#fff;font:800 1rem "Nunito",sans-serif;background:radial-gradient(circle at 35% 30%,#fff8,#ff4d6d 35%,#7b2ff7 100%);box-shadow:0 0 0 6px #ffffff18,0 0 60px #ff4d6d99,inset 0 -12px 24px #0006;animation:pulse 2.2s ease-in-out infinite}
.orb span{display:block;font-size:2.4rem;margin-bottom:2px}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 14px #ffffff10,0 0 90px #ffd166aa,inset 0 -12px 24px #0006}}
.hint{margin:14px 0 0;font-weight:800;color:var(--gold)}
.opened .orb,.opened .hint{display:none}
.stage{display:none;margin-top:26px;text-align:left}
.opened .stage{display:block}
.card{position:relative;border-radius:28px;padding:28px 22px 22px;color:var(--ink);background:linear-gradient(160deg,#fffaf0,#ffe9c2);border:3px solid var(--gold);box-shadow:0 0 0 4px var(--red),0 30px 60px #000a;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.9) rotateX(20deg)}to{opacity:1;transform:none}}
.card h2{font:400 1.85rem/1.25 "Marck Script",cursive;color:#c9184a;text-align:center;margin:0 0 8px}
.lead{text-align:center;font-weight:700;line-height:1.5;margin:0 0 14px;color:#5a2a40}
.row{display:flex;gap:12px;padding:10px 0;border-bottom:2px dotted #e0a80099}
dl{margin:0 0 16px}dt{flex:0 0 108px;font-weight:800;color:#2b1d6e}dd{margin:0;font-weight:800}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px;text-align:center}
.count div{background:#141a5c;color:var(--cream);border-radius:14px;padding:10px 2px}
.count b{display:block;font:400 clamp(1.1rem,5.4vw,1.5rem) "Rubik Mono One",sans-serif;color:var(--gold);font-variant-numeric:tabular-nums}
.count span{font-size:.75rem;font-weight:700}
.btn{flex:1;display:block;text-align:center;text-decoration:none;padding:14px 10px;border-radius:999px;border:3px solid #2b1d6e;background:transparent;color:#2b1d6e;font:800 .98rem "Nunito",sans-serif;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.y{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px #ff4d6d66}
.btn:focus-visible,.orb:focus-visible,.mus:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
.cta{display:flex;gap:12px}
.toast{min-height:1.4em;margin:12px 0 0;text-align:center;font-weight:800;color:#c9184a}
.prog{margin-top:22px;padding:20px 18px;border-radius:24px;background:#ffffff14;border:1.5px solid #ffd16688;backdrop-filter:blur(10px)}
.prog h3{font:400 1.8rem "Marck Script",cursive;color:var(--gold);margin:0 0 10px;text-align:center}
.prog ol{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px dashed #ffd16699}
.prog li{position:relative;padding:8px 0 8px 14px;font-weight:700;opacity:0;transform:translateX(-14px);animation:in .6s forwards}
.prog li::before{content:"";position:absolute;left:-31px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.prog li b{color:var(--gold);margin-right:8px;font-variant-numeric:tabular-nums}
@keyframes in{to{opacity:1;transform:none}}
.mus{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:30;width:48px;height:48px;border-radius:50%;border:3px solid var(--gold);background:#ff4d6d;font-size:22px;cursor:pointer;box-shadow:0 4px 14px #0008}
.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:#070a24ee;backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s;overflow:auto}
.ov.show{opacity:1;visibility:visible;transition:opacity .4s}
.ovcard{width:min(360px,100%);text-align:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.ovcard>.btn{width:100%;margin-top:16px;flex:none;color:#fff;border-color:var(--gold)}
.ask{background:#ffffff12;border:3px solid var(--gold);border-radius:24px;padding:26px 20px 22px}
.ask h3{font:400 2rem/1.15 "Marck Script",cursive;margin:0 0 6px;color:var(--gold)}
.ask p{margin:0 0 14px;font-weight:600}
.ask input{width:100%;padding:15px 18px;border-radius:999px;border:3px solid var(--gold);background:var(--cream);color:var(--ink);font:800 1.05rem "Nunito",sans-serif;text-align:center}
.err{min-height:1.3em;margin:8px 0 0!important;color:#ff9aa8;font-size:.9rem}
.ask .btn{width:100%;margin-top:6px;color:#fff}
.tk{background:var(--cream);color:var(--ink);border-radius:20px;border:3px solid var(--gold);overflow:hidden;text-align:left;filter:drop-shadow(0 20px 26px #000a)}
.tk-main{padding:22px 20px 16px;background:linear-gradient(180deg,#fff,#ffe9c2)}
.tk-k{margin:0;font-weight:800;color:#c9184a;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.tk-n{font:400 2rem/1.15 "Marck Script",cursive;margin:6px 0 0;color:#2b1d6e;overflow-wrap:anywhere}
.tk-w{margin:4px 0 0;font-weight:800;color:#5a2a40;font-size:.95rem;overflow-wrap:anywhere}
.ask input+input{margin-top:10px}
.tk-y{font:400 3rem/1.1 "Rubik Mono One",sans-serif;margin:4px 0;color:var(--gold);text-shadow:3px 3px 0 #c9184a}
.tk-i{margin:8px 0 0;font-weight:800;line-height:1.5;font-size:.95rem;white-space:pre-line}
.tk-stub{border-top:3px dashed var(--gold);padding:0 20px;height:76px;background:#ffeab8;display:flex;align-items:center;justify-content:space-between}
.tk-stub span{font:400 .95rem "Rubik Mono One",sans-serif;color:#2b1d6e}
.stamp{padding:6px 12px;border:3px solid #c9184a;border-radius:10px;color:#c9184a;font:400 .8rem "Rubik Mono One",sans-serif;transform:rotate(-10deg);animation:st .5s .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes st{from{opacity:0;transform:scale(3) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-10deg)}}
.ov-msg{margin:14px 0 0;font:400 1.8rem "Marck Script",cursive;color:var(--gold)}
.okmsg{margin:10px 0 0;font-weight:800;color:#5dff9a}
.sorry{background:linear-gradient(180deg,#1b2a66,#101a45);border:3px solid var(--gold);border-radius:24px;padding:24px 20px;box-shadow:0 0 0 4px var(--ice)}
.sorry h3{font:400 2rem "Marck Script",cursive;margin:8px 0 4px;color:var(--gold)}
.sorry p{margin:0;line-height:1.6;font-weight:600}
.send{margin-top:12px;padding:12px;border-radius:16px;border:1.5px dashed #ffd16699;text-align:left}
.send input{width:100%;padding:10px 12px;border-radius:12px;border:0;background:#0006;color:var(--cream);font:600 .85rem "Nunito",sans-serif;margin:6px 0}
.send .btn{color:var(--cream);border-color:var(--gold);padding:10px}
.own{margin-top:22px;padding:18px;border-radius:20px;background:#0006;border:1.5px solid #ffd16688}
.own h3{margin:0 0 4px;font:400 1.7rem "Marck Script",cursive;color:var(--gold)}
.own ul{margin:10px 0 14px;padding:0;list-style:none;max-height:240px;overflow:auto}
.own li{padding:6px 0;border-bottom:1px dotted #fff4;font-weight:600;overflow-wrap:anywhere}
.own .btn{color:var(--cream);border-color:var(--gold);width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.prog li{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="sky"><div class="aur"></div></div>
<canvas id="fx" aria-hidden="true"></canvas>
<svg class="land" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <circle cx="520" cy="40" r="26" fill="#fff6c8" opacity=".95"/><circle cx="530" cy="34" r="24" fill="#2a2368" opacity=".35"/>
  <path d="M0 150 L120 70 L210 135 L330 50 L450 140 L560 85 L680 145 L800 95 V220 H0Z" fill="#2c2f7a"/>
  <path d="M0 175 L90 120 L190 165 L300 110 L420 170 L540 125 L660 172 L800 130 V220 H0Z" fill="#e8f0ff" opacity=".9"/>
  <path d="M0 190 Q200 160 400 185 T800 175 V220 H0Z" fill="#f7fbff"/>
  <g transform="translate(400 150)"><ellipse cx="0" cy="40" rx="62" ry="8" fill="#0003"/><path d="M-50 40 A50 38 0 0 1 50 40Z" fill="#fff6e2" stroke="#c9a66b" stroke-width="2"/><path d="M-12 -4 L0 -22 L12 -4Z" fill="#e0243c"/><rect x="-12" y="14" width="24" height="26" rx="3" fill="#7b3f1d"/><circle class="win" cx="0" cy="26" r="2" fill="#ffd166"/><path d="M-50 22 H50" stroke="#e0243c" stroke-width="3"/>
    <circle class="smoke" cx="0" cy="-26" r="7" fill="#fff"/><circle class="smoke" style="animation-delay:-2s" cx="3" cy="-26" r="6" fill="#fff"/></g>
  <g fill="#0d5a3b"><path d="M280 190 L300 130 L320 190Z"/><path d="M292 165 L300 120 L308 165Z" fill="#157a4f"/><path d="M485 192 L510 120 L535 192Z"/><path d="M500 160 L510 105 L520 160Z" fill="#157a4f"/><path d="M545 190 L563 140 L581 190Z"/></g>
  <g fill="#ffd166"><circle cx="300" cy="125" r="3"/><circle cx="510" cy="112" r="3"/></g>
</svg>

<button class="mus" id="mus" type="button" aria-label="Хөгжим асаах/унтраах">🔇</button>

<main id="app">
  <p class="greet">Шинэ жилийн баярын урилга</p>
  <h1 class="year" id="year">2027</h1>
  <span class="org" id="org"></span>
  <button class="orb" id="gift" type="button" aria-label="Урилгыг нээх"><span>🎁</span>Нээх</button>
  <p class="hint">Шидэт бөмбөг дээр дарж урилгаа нээгээрэй</p>

  <div class="stage">
    <section class="card" aria-label="Урилга">
      <h2 id="guest"></h2>
      <p class="lead">Хамтдаа шинэ жилээ угтацгаая. Дуу хуур, бэлэг, азтан, инээд хөөр биднийг хүлээж байна!</p>
      <dl>
        <div class="row"><dt>Огноо</dt><dd id="f-date"></dd></div>
        <div class="row"><dt>Цаг</dt><dd id="f-time"></dd></div>
        <div class="row"><dt>Газар</dt><dd id="f-place"></dd></div>
      </dl>
      <div class="count" role="timer" aria-label="Үдэшлэг хүртэл">
        <div><b id="c-d">0</b><span>өдөр</span></div><div><b id="c-h">0</b><span>цаг</span></div>
        <div><b id="c-m">0</b><span>минут</span></div><div><b id="c-s">0</b><span>секунд</span></div>
      </div>
      <div class="cta"><button class="btn y" type="button" data-r="y">Очно</button><button class="btn" type="button" data-r="n">Чадахгүй</button></div>
      <button class="btn" id="wishBtn" type="button" style="width:100%;margin-top:12px">🎲 Шинэ жилийн хүсэл сугалах</button>
      <p class="toast" id="toast" aria-live="polite"></p>
    </section>
    <section class="prog" aria-label="Хөтөлбөр"><h3>Үдшийн хөтөлбөр</h3><ol id="prog"></ol></section>
    <section class="own" id="own" hidden>
      <h3>Ирсэн хариултууд</h3><p id="ownSum"></p><ul id="ownList"></ul>
      <button class="btn" id="ownCopy" type="button">Жагсаалт хуулах</button>
    </section>
  </div>
</main>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-live="polite"><div class="ovcard" id="ovcard"></div></div>

<script>
/* ===== Мэдээллээ энд засаарай ===== */
const CONFIG={
  org:"H&A Travel", year:"2027",
  guest:"Эрхэм хүндэт таныг H&A Travel шинэ жилийн үдэшлэгт урьж байна",
  date:"2026 оны 12-р сарын 5", time:"18:00 цагаас",
  place:"Улаанбаатар, Flower Hotel",
  target:new Date(2026,11,5,18,0,0),
  formEmail:"oddnntodontuya@gmail.com",
  contact:{phone:"",email:"oddnntodontuya@gmail.com"},
  /* Хөтөлбөр: цаг болон агуулгаа өөрийнхөөрөө засаарай */
  program:[["18:00","Угтах уулзалт, зургийн булан"],["18:30","Оройн зоог"],["19:00","Сугалаа, шагнал"],["19:30","Бүжиг, Чөлөөт цаг"]]
};
/* ================================== */
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
$("year").textContent=CONFIG.year;$("org").textContent=CONFIG.org;$("guest").textContent=CONFIG.guest;
$("f-date").textContent=CONFIG.date;$("f-time").textContent=CONFIG.time;$("f-place").textContent=CONFIG.place;
const PC=["#ff4d6d","#ffd166","#8ee3ff","#5dff9a","#ff8fd8","#b388ff"];
CONFIG.program.forEach((p,i)=>{const li=document.createElement("li"),b=document.createElement("b");b.textContent=p[0];li.append(b,p[1]);li.style.setProperty("--c",PC[i%PC.length]);li.style.animationDelay=(.9+i*.18)+"s";$("prog").appendChild(li)});
function tick(){const s=Math.floor(Math.max(0,CONFIG.target-new Date())/1000);
  $("c-d").textContent=Math.floor(s/86400);$("c-h").textContent=String(Math.floor(s%86400/3600)).padStart(2,"0");
  $("c-m").textContent=String(Math.floor(s%3600/60)).padStart(2,"0");$("c-s").textContent=String(s%60).padStart(2,"0")}
tick();setInterval(tick,1000);

/* Од, цас, салют, конфетти, зүрх */
const COL=PC,cv=$("fx"),c=cv.getContext("2d");let W,H,dpr;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener("resize",size);
const snow=Array.from({length:reduce?0:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2.4+.8,v:Math.random()*.7+.3,d:Math.random()*6}));
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.55,r:Math.random()*1.3+.4,p:Math.random()*6}));
let conf=[],sparks=[],hearts=[],hv=0,shoot=null;
function confetti(x,y,n,sp){if(reduce)return;for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*sp,s=Math.random()*10+4;conf.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:Math.random()*8+5,h:Math.random()*5+3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,col:COL[Math.floor(Math.random()*COL.length)],life:1})}}
function firework(x,y){if(reduce)return;const col=COL[Math.floor(Math.random()*COL.length)];for(let i=0;i<64;i++){const a=i/64*6.283,s=Math.random()*5+2;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col})}}
function heart(){hearts.push({x:Math.random()*W,y:H+20,v:Math.random()+.7,s:Math.random()*10+9,d:Math.random()*6,col:["#ff8fd8","#ffd166","#fff6e2"][Math.floor(Math.random()*3)]})}
setInterval(()=>{if(!reduce&&!shoot)shoot={x:Math.random()*W*.8,y:Math.random()*H*.25,l:1}},5000);
function frame(t){
  c.clearRect(0,0,W,H);c.fillStyle="#fff6e2";
  for(const s of stars){c.globalAlpha=.25+.6*Math.abs(Math.sin(t/900+s.p));c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.283);c.fill()}
  if(shoot){c.globalAlpha=shoot.l;c.strokeStyle="#fff";c.lineWidth=2;c.beginPath();c.moveTo(shoot.x,shoot.y);c.lineTo(shoot.x-60,shoot.y-30);c.stroke();shoot.x+=14;shoot.y+=7;shoot.l-=.03;if(shoot.l<=0)shoot=null}
  c.globalAlpha=.85;
  for(const f of snow){f.y+=f.v/H;f.d+=.012;f.x+=Math.sin(f.d)*.4/W;if(f.y>1.01){f.y=-.01;f.x=Math.random()}c.beginPath();c.arc(f.x*W,f.y*H,f.r,0,6.283);c.fill()}
  conf=conf.filter(p=>p.life>0&&p.y<H+30);
  for(const p of conf){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.004;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.globalAlpha=Math.min(1,p.life*2);c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}
  sparks=sparks.filter(q=>q.life>0);
  for(const q of sparks){q.vy+=.06;q.vx*=.985;q.vy*=.985;q.x+=q.vx;q.y+=q.vy;q.life-=.016;c.globalAlpha=Math.max(q.life,0);c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,2.2,0,6.283);c.fill()}
  hearts=hearts.filter(h=>h.y>-30);
  for(const h of hearts){h.y-=h.v;h.d+=.03;h.x+=Math.sin(h.d)*.6;c.globalAlpha=.9;c.fillStyle=h.col;c.save();c.translate(h.x,h.y);const k=h.s/10;c.scale(k,k);c.beginPath();c.moveTo(0,4);c.bezierCurveTo(-10,-4,-6,-12,0,-6);c.bezierCurveTo(6,-12,10,-4,0,4);c.fill();c.restore()}
  c.globalAlpha=1;requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* Хөгжим (Jingle Bells) */
let ac=null,on=false,mt=null,mi=0;
const E=659,F=698,G=784,C5=523,D=587;
const MEL=[[E,1],[E,1],[E,2],[E,1],[E,1],[E,2],[E,1],[G,1],[C5,1.5],[D,.5],[E,4],[F,1],[F,1],[F,1.5],[F,.5],[F,1],[E,1],[E,1],[E,.5],[E,.5],[E,1],[D,1],[D,1],[E,1],[D,2],[G,2]];
let sil=null;
/* Чимээгүй wav (iPhone-д дууг "playback" горимд оруулахад хэрэгтэй) */
function silentWav(){
  const n=8000,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);
  v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,"data");v.setUint32(40,n*2,true);
  let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));
  return "data:audio/wav;base64,"+btoa(s);
}
function ctx(){
  if(navigator.audioSession)navigator.audioSession.type="playback";
  if(!ac){
    const A=window.AudioContext||window.webkitAudioContext;
    if(A)ac=new A();
    try{sil=new Audio(silentWav());sil.loop=true;sil.play().catch(()=>{})}catch(e){}
  }
  if(ac&&ac.state!=="running")ac.resume();
  return ac;
}
function note(f,d,v){const a=ctx();if(!a)return;const t=a.currentTime;[[1,v||.12],[2,(v||.12)/3]].forEach(([m,g])=>{const o=a.createOscillator(),n=a.createGain();o.type="triangle";o.frequency.value=f*m;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g,t+.01);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n).connect(a.destination);o.start(t);o.stop(t+d+.05)})}
function play(){if(!on)return;const [f,u]=MEL[mi%MEL.length];mi++;note(f,.35,.1);if(mi%4===1)note(f/2,.5,.07);mt=setTimeout(play,u*220)}
function setMusic(v){on=v;clearTimeout(mt);$("mus").textContent=on?"🔊":"🔇";if(on){ctx();play()}}
$("mus").addEventListener("click",()=>setMusic(!on));

const WISH=["Шинэ ондоо мөнгө нь урсаж, данс нь дүүрч, карт нь лимитгүй болох болтугай! 💸","Дарга нь магтаж, ажил нь цөөрч, цалин нь өөрөө өсөх болтугай! 😂","Сугалаанд супер хонжвор таарч, аз нь араас нь гүйх болтугай! 🎁","Идсэн нь шингэж, жин нь буурч, гоо сайхан нь улам нэмэгдэх болтугай! 🍰","2027 онд аялал нь олширч, амралт нь уртасч, зардлыг нь өөр хүн даах болтугай! ✈️","Өглөө сэрэхэд толгой өвдөхгүй, данс шалгахад сэтгэл өвдөхгүй байх болтугай! 🍻","Хийсэн ажил нь бүтэж, хэлсэн үг нь биелж, авсан цалин нь сарын эцэст үлдэх болтугай! 💰","Утас нь шинэчлэгдэж, машин нь сайжирч, хуучин өр нь устах болтугай! 🚗","2027 онд аз нь дийлж, архи нь шингэж, амьдрал нь кино шиг гоё байх болтугай! 🥳"];
$("wishBtn").addEventListener("click",e=>{$("toast").textContent=WISH[Math.floor(Math.random()*WISH.length)];[C5,E,G,C5*2,E*2].forEach((f,k)=>setTimeout(()=>note(f,.4,.12),k*90));const r=e.currentTarget.getBoundingClientRect();confetti(r.left+r.width/2,r.top,50,2.4)});

/* Хариу бүртгэх */
let store=null,uid=null,ans=null,myName="",myWork="",myRole="";
const ANS={y:"Очно",n:"Чадахгүй"};
async function initRT(){
  if(!window.claude||!claude.use)return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!db||!user)return;uid=await user.id();if(!uid)return;store=db;
    const mine=await db.doc("rsvps/"+uid).get();
    if(mine.exists){const d=mine.data();myName=d.name||"";myWork=d.work||"";myRole=d.role||"";$("toast").textContent="Таны өмнөх хариу: "+(ANS[d.answer]||"")+(myName?" ("+myName+")":"")}
    if(await user.canEdit()){$("own").hidden=false;db.collection("rsvps").orderBy("ts","desc").limit(500).onSnapshot(s=>renderOwner(s.docs.map(d=>d.data())),()=>{})}
  }catch(e){store=null}
}
initRT();
let ownText="";
function renderOwner(list){
  const y=list.filter(d=>d.answer==="y"),n=list.filter(d=>d.answer==="n");
  $("ownSum").textContent="Очно: "+y.length+"   Чадахгүй: "+n.length;
  const ul=$("ownList");ul.textContent="";
  list.forEach(d=>{const li=document.createElement("li");li.textContent=(d.answer==="y"?"✓ ":"✕ ")+(d.name||"")+(d.work?" — "+d.work:"")+(d.role?", "+d.role:"");ul.appendChild(li)});
  const fm=(d,i)=>(i+1)+". "+d.name+(d.work?" — "+d.work:"")+(d.role?", "+d.role:"");
  ownText="Очно ("+y.length+"):\n"+y.map(fm).join("\n")+"\n\nЧадахгүй ("+n.length+"):\n"+n.map(fm).join("\n");
}
$("ownCopy").addEventListener("click",async e=>{try{await navigator.clipboard.writeText(ownText);e.target.textContent="Хуулагдлаа ✓"}catch(x){e.target.textContent="Хуулж чадсангүй"}setTimeout(()=>e.target.textContent="Жагсаалт хуулах",2000)});

const ov=$("ov"),oc=$("ovcard");
function closeRsvp(){ov.classList.remove("show");clearInterval(hv)}
ov.addEventListener("click",e=>{if(e.target===ov||e.target.id==="ovx")closeRsvp()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeRsvp()});
document.querySelectorAll(".cta .btn").forEach(b=>b.addEventListener("click",()=>askName(b.dataset.r)));
function askName(a){
  ans=a;clearInterval(hv);
  oc.innerHTML=`<div class="ask"><h3 id="askT"></h3><p>Үнэн зөв бөглөөрэй баярлалаа.</p><input id="nm" type="text" maxlength="60" autocomplete="name" placeholder="Овог, нэр" aria-label="Таны нэр"><input id="wp" type="text" maxlength="80" autocomplete="organization" placeholder="Ажлын газрын нэр" aria-label="Ажлын газрын нэр"><input id="ps" type="text" maxlength="80" autocomplete="organization-title" placeholder="Албан тушаал" aria-label="Албан тушаал"><p class="err" id="err" role="alert"></p><button class="btn y" id="nmOk" type="button">Баталгаажуулах</button></div>`;
  $("askT").textContent=a==="y"?"Баярлалаа! Мэдээллээ бичнэ үү":"Ойлголоо. Мэдээллээ бичнэ үү";
  const nm=$("nm");nm.value=myName;$("wp").value=myWork;$("ps").value=myRole;$("nmOk").addEventListener("click",submit);["nm","wp","ps"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));
  ov.classList.add("show");setTimeout(()=>nm.focus({preventScroll:true}),450);
}
async function submit(){
  const name=$("nm").value.trim().replace(/\s+/g," ");
  const work=$("wp").value.trim().replace(/\s+/g," "),role=$("ps").value.trim().replace(/\s+/g," ");
  if(name.length<2){$("err").textContent="Нэрээ бичнэ үү";$("nm").focus();return}
  if(work.length<2){$("err").textContent="Ажлын газрын нэрээ бичнэ үү";$("wp").focus();return}
  if(role.length<2){$("err").textContent="Албан тушаалаа бичнэ үү";$("ps").focus();return}
  myName=name;myWork=work;myRole=role;const btn=$("nmOk");btn.disabled=true;btn.textContent="Хадгалж байна…";
  let saved=false;
  if(store&&uid){try{await store.doc("rsvps/"+uid).set({name,work,role,answer:ans,ts:Date.now()});saved=true}catch(e){}}
  if(CONFIG.formEmail){try{
    const r=await fetch("https://formsubmit.co/ajax/"+CONFIG.formEmail,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:CONFIG.org+" урилгын хариу: "+name+" - "+ANS[ans],"Нэр":name,"Ажлын газар":work,"Албан тушаал":role,"Хариу":ANS[ans],"Огноо":new Date().toLocaleString("mn-MN"),_template:"table",_captcha:"false"})});
    const j=await r.json();if(r.ok&&String(j.success)!=="false")saved=true;
  }catch(e){}}
  $("toast").textContent="Таны хариу: "+ANS[ans]+" ("+name+")";
  showResult(saved);
}
function ticketNo(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%9000;return 1000+h}
function sendBlock(saved){
  if(saved)return `<p class="okmsg">✓ Таны хариу зохион байгуулагчид бүртгэгдлээ</p>`;
  const k=CONFIG.contact||{};
  return `<div class="send"><p style="margin:0;font-weight:700">Хариугаа зохион байгуулагчид илгээнэ үү:</p><input id="msgBox" readonly aria-label="Илгээх мессеж"><div class="cta">${k.phone?`<a class="btn" id="smsA">SMS</a>`:""}${k.email?`<a class="btn" id="mailA">Имэйлээр илгээх</a>`:""}</div></div>`;
}
function wireSend(saved){
  if(saved)return;
  const msg=CONFIG.org+" шинэ жилийн үдэшлэг: "+myName+" ("+myWork+", "+myRole+") - "+(ans==="y"?"очно":"ирж чадахгүй"),k=CONFIG.contact||{};
  $("msgBox").value=msg;
  if(k.phone)$("smsA").href="sms:"+k.phone+"?body="+encodeURIComponent(msg);
  if(k.email){
    const a=$("mailA"),sub=encodeURIComponent(CONFIG.org+" урилгын хариу"),body=encodeURIComponent(msg);
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||navigator.maxTouchPoints>1;
    if(mobile){a.href="mailto:"+k.email+"?subject="+sub+"&body="+body}
    else{a.href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(k.email)+"&su="+sub+"&body="+body;a.target="_blank";a.rel="noopener"}
  }
}
function showResult(saved){
  if(ans==="y"){
    oc.innerHTML=`<div class="tk"><div class="tk-main"><p class="tk-k" id="tOrg"></p><p class="tk-n" id="tName"></p><p class="tk-w" id="tWork"></p><p class="tk-y" id="tYear"></p><p class="tk-i" id="tInfo"></p></div><div class="tk-stub"><span id="tNo"></span><div class="stamp">Баталгаажлаа</div></div></div><p class="ov-msg">Тэсэн ядан хүлээж байна!</p>${sendBlock(saved)}<button class="btn y" id="ovx" type="button">Баярлалаа</button>`;
    $("tOrg").textContent=CONFIG.org+" шинэ жилийн үдэшлэг";$("tName").textContent=myName;$("tWork").textContent=myWork+" · "+myRole;$("tYear").textContent=CONFIG.year;
    $("tInfo").textContent=CONFIG.date+"\n"+CONFIG.time+"\n"+CONFIG.place;$("tNo").textContent="№ "+ticketNo(myName);
    for(let i=0;i<7;i++)setTimeout(()=>firework(W*(.12+Math.random()*.76),H*(.1+Math.random()*.4)),i*380);
    confetti(W/2,H*.7,120,2.6);
  }else{
    oc.innerHTML=`<div class="sorry"><div style="font-size:4rem">⛄</div><h3 id="sName"></h3><p>Шинэ ондоо юу санасан есөн цагаан хүсэл нь сэтгэлчлэн биелэх болтугай. Дараа заавал хамт байцгаая!</p></div>${sendBlock(saved)}<button class="btn y" id="ovx" type="button">Баярлалаа</button>`;
    $("sName").textContent=myName+", харамсалтай ч ойлголоо";
    if(!reduce){for(let i=0;i<8;i++)setTimeout(heart,i*160);hv=setInterval(heart,300)}
  }
  wireSend(saved);
  setTimeout(()=>{const x=$("ovx");if(x)x.focus({preventScroll:true})},500);
}
